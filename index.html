<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeJourney - プログラミング学習</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --primary-hover: #4338ca;
            --success: #059669;
            --bg-base: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --code-bg: #0f172a;
            --code-text: #f8fafc;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(255, 255, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            line-height: 1.5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Navbar */
        nav {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            z-index: 10;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-actions button {
            background: none;
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .nav-actions button:hover {
            background-color: var(--bg-base);
            color: var(--text-main);
        }

        /* App Container */
        #app {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        /* Views */
        .top-menu {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .btn-catalog {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            transition: transform 0.2s;
        }

        .btn-catalog:hover {
            transform: scale(1.05);
        }

        .serial-no-badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            border: 1px solid var(--primary);
            font-weight: 600;
        }

        .difficulty-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid;
        }
        .diff-A { color: #059669; background: rgba(5,150,105,0.08); border-color: #059669; }
        .diff-B { color: #2563eb; background: rgba(37,99,235,0.08); border-color: #2563eb; }
        .diff-C { color: #d97706; background: rgba(217,119,6,0.08); border-color: #d97706; }
        .diff-D { color: #dc2626; background: rgba(220,38,38,0.08); border-color: #dc2626; }

        /* OVER POWER Ranks */
        .rank-rainbow {
            background: linear-gradient(135, #ff00ff, #00ffff, #ff00ff);
            background-size: 200% 200%;
            animation: rainbow-anim 3s linear infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .rank-rainbow-bg {
            background: linear-gradient(135, #6366f1, #a855f7, #ec4899);
            color: white;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }
        @keyframes rainbow-anim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .rank-platinum { color: #f8fafc; text-shadow: 0 0 10px rgba(255,255,255,0.3); font-weight: 700; }
        .rank-gold { color: #facc15; font-weight: 700; }
        .rank-silver { color: #94a3b8; font-weight: 700; }
        .rank-bronze { color: #b45309; font-weight: 700; }

        .op-badge {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
        }
        .op-percent {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-left: 4px;
        }
        .op-container {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .op-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .op-item {
            text-align: center;
            padding: 0.75rem;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .view {
            display: none;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease-out;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* View 1: Courses */
        .header-section {
            text-align: center;
            margin-bottom: 3rem;
            margin-top: 2rem;
        }

        .header-section h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-section p {
            color: var(--text-muted);
            font-size: 1.125rem;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }

        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .card p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .progress-bar {
            height: 8px;
            background-color: var(--bg-base);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.5s ease-out;
        }

        /* View 2: Chapters */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 2rem;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1rem;
        }

        .back-btn:hover {
            color: var(--primary);
        }

        .chapter {
            margin-bottom: 2rem;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .chapter-header {
            padding: 1.5rem 2rem;
            background-color: #f8fafc;
            border-bottom: 1px solid var(--border);
        }

        .chapter-header h3 {
            font-size: 1.25rem;
            color: var(--text-main);
        }

        .lesson-list {
            list-style: none;
        }

        .lesson-item {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .lesson-item:last-child {
            border-bottom: none;
        }

        .lesson-item:hover {
            background-color: var(--bg-base);
        }

        .lesson-title {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: transparent;
            transition: all 0.2s;
        }

        .lesson-item.completed .status-icon {
            background-color: var(--success);
            border-color: var(--success);
            color: white;
        }

        .lesson-item.completed .lesson-title span {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .lesson-meta-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lesson-status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--text-muted);
            background: #fff;
        }

        .lesson-status-cleared {
            color: #065f46;
            border-color: #6ee7b7;
            background: #ecfdf5;
        }

        .lesson-status-partial {
            color: #92400e;
            border-color: #fcd34d;
            background: #fffbeb;
        }

        .lesson-best-score {
            font-size: 0.75rem;
            color: var(--text-muted);
            min-width: 55px;
            text-align: right;
        }

        /* View 3: Lesson Workspace */
        #view-lesson {
            padding: 0;
            max-width: 100%;
            height: 100%;
            display: none;
        }

        #view-lesson.active {
            display: flex;
        }

        .workspace {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .content-panel {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
        }

        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--code-bg);
        }

        .lesson-meta {
            margin-bottom: 2rem;
        }

        .lesson-meta h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .instruction-box {
            background-color: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 1.5rem;
            border-radius: 0 8px 8px 0;
            margin: 2rem 0;
        }

        .instruction-box h4 {
            color: #1e3a8a;
            margin-bottom: 0.5rem;
            font-size: 1.125rem;
        }

        .instruction-box p {
            color: #1e40af;
        }

        .editor-header {
            background: #0f172a;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            font-family: 'Fira Code', monospace;
            font-size: 0.875rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #code-editor {
            flex: 1;
            width: 100%;
            background: transparent;
            color: var(--code-text);
            font-family: 'Fira Code', monospace;
            font-size: 1rem;
            padding: 1.5rem;
            border: none;
            resize: none;
            outline: none;
            line-height: 1.6;
        }

        .editor-actions {
            background: #0f172a;
            padding: 1rem;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            align-items: center;
        }

        /* Drill Panel (Practice Mode) */
        .drill-panel {
            flex: 1;
            display: none;
            flex-direction: column;
            background: #f8fafc;
            padding: 3rem;
            align-items: center;
            justify-content: center;
        }

        .drill-card {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .drill-card h3 {
            margin-bottom: 2rem;
            color: var(--text-main);
            font-size: 1.5rem;
        }

        .drill-input-wrapper {
            margin-bottom: 2.5rem;
        }

        .drill-choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 2rem 0;
        }

        .choice-btn {
            padding: 1.25rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: white;
            color: var(--text-main);
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .choice-btn:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .choice-btn.selected {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .drill-input {
            width: 100%;
            padding: 1.5rem;
            font-size: 2rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            text-align: center;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            color: var(--primary);
        }

        .drill-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .drill-textarea {
            width: 100%;
            padding: 1.5rem;
            font-size: 1.25rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            min-height: 120px;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            resize: vertical;
        }

        .drill-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .drill-btn {
            width: 100%;
            padding: 1.25rem;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .drill-feedback {
            margin-top: 1.5rem;
            font-size: 1.125rem;
            min-height: 1.5rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .feedback {
            color: white;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }

        .feedback.success {
            color: var(--success);
            display: flex;
        }

        .feedback.error {
            color: #ef4444;
            display: flex;
        }

        .content-panel p {
            margin-bottom: 1rem;
        }

        .content-panel code {
            background: #f1f5f9;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            font-size: 0.875em;
            color: #b91c1c;
        }

        .content-panel pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Fira Code', monospace;
            margin-bottom: 1.5rem;
        }

        .content-panel h2 {
            margin: 2rem 0 1rem;
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        /* AI Grading UI */
        .ai-mode-selector {
            display: flex;
            background: #e2e8f0;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            width: fit-content;
        }

        .ai-mode-btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s;
            background: transparent;
            color: var(--text-muted);
        }

        .ai-mode-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .ai-result-container {
            margin-top: 2rem;
            text-align: left;
            border-top: 2px solid var(--border);
            padding-top: 2rem;
            animation: fadeIn 0.5s ease-out;
        }

        .ai-score-badge {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .ai-score-value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
        }

        .ai-eval-badge {
            background: var(--primary);
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .ai-commentary-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .ai-result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .ai-comment-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border);
        }

        .ai-comment-box h5 {
            font-size: 1rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .ai-comment-box.good h5 {
            color: var(--success);
        }

        .ai-comment-box.bad h5 {
            color: #ef4444;
        }

        .ai-comment-box.advice h5 {
            color: #f59e0b;
        }

        .ai-comment-box.solution h5 {
            color: var(--primary);
        }

        .image-upload-wrapper {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .image-upload-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .image-preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
            border: 1px solid var(--border);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, .3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h3 {
            font-size: 1.25rem;
            color: var(--text-main);
        }

        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
        }

        .settings-group {
            margin-bottom: 1.5rem;
        }

        .settings-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .settings-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .settings-help {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            line-height: 1.4;
        }

        .settings-help a {
            color: var(--primary);
            text-decoration: none;
        }

        .settings-help a:hover {
            text-decoration: underline;
        }

        .btn-icon {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>

<body>

    <nav>
        <div class="brand" onclick="app.navigateHome()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="m18 16 4-4-4-4" />
                <path d="m6 8-4 4 4 4" />
                <path d="m14.5 4-5 16" />
            </svg>
            CodeJourney
        </div>
        <div class="nav-actions" style="display: flex; gap: 0.5rem;">
            <button class="btn-icon" onclick="app.showSettings()" title="設定">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                        if (data && data.data) {

                            this.results = { ...this.results, ...(data.data.results || {}) };

            recordAttempt(lessonId, payload = {}) {
                if (!lessonId) return;
                const prev = this.results[lessonId] || {};
                const scoreNum = Number(payload.score);
                const hasScore = Number.isFinite(scoreNum);
                const prevBest = Number(prev.bestScore);
                const nextBest = hasScore
                    ? (Number.isFinite(prevBest) ? Math.max(prevBest, scoreNum) : scoreNum)
                    : prevBest;
                this.results[lessonId] = {
                    attempts: (prev.attempts || 0) + 1,
                    lastScore: hasScore ? scoreNum : prev.lastScore,
                    bestScore: Number.isFinite(nextBest) ? nextBest : prev.bestScore,
                    lastEvaluation: payload.evaluation || prev.lastEvaluation || "",
                    bestEvaluation: payload.isBest ? (payload.evaluation || prev.bestEvaluation || "") : (prev.bestEvaluation || payload.evaluation || ""),
                    cleared: Boolean(prev.cleared || payload.cleared),
                    updatedAt: new Date().toISOString(),
                };
                this.saveResults();
                this.renderCurrentView();
            },
            getLessonState(lessonId) {
                if (this.progress[lessonId]) return 'cleared';
                const result = this.getLessonResult(lessonId);
                if (result && (result.attempts || 0) > 0) return 'partial';
                return 'new';

                const newPath = [...this.state.path, key];
                const node = this.getNode(newPath);

            getCourseStats(node, pathStr = "") {
                if (!window.problemCatalog) {
                    console.warn("Catalog not loaded yet");
                    return { total: 0, completed: 0, percent: 0 };
                }

                // カタログから、pathStr で始まる全問題を取得（階層的な進捗集計）
                const problemsInScope = window.problemCatalog.filter(p => {
                    if (pathStr === "") return true; // ルートの場合は全件マッチ
                    // path が pathStr で始まっているか、または pathStr そのものか
                    return p.path === pathStr || p.path.startsWith(pathStr + '/');
                });
                
                let totalPoints = 0;
                let earnedPoints = 0;

                problemsInScope.forEach(p => {
                    const max = this.state.levelMaxScores[p.level] || 100;
                    totalPoints += max;
                    
                    const result = this.results[p.id];
                    if (result && result.bestScore !== undefined) {
                        earnedPoints += Math.min(Number(result.bestScore), max);
                    } else if (this.progress[p.id]) {
                        earnedPoints += max; // 旧データの互換性
                    }
                });

                return {
                    total: totalPoints,
                    completed: earnedPoints,
                    percent: totalPoints === 0 ? 0 : Math.round((earnedPoints / totalPoints) * 100)
                };
            },

            getRankInfo(percent) {
                if (percent >= 97) return { label: 'RAINBOW', class: 'rank-rainbow', bgClass: 'rank-rainbow-bg' };
                if (percent >= 90) return { label: 'PLATINUM', class: 'rank-platinum', bgClass: '' };
                if (percent >= 75) return { label: 'GOLD', class: 'rank-gold', bgClass: '' };
                if (percent >= 50) return { label: 'SILVER', class: 'rank-silver', bgClass: '' };
                return { label: 'BRONZE', class: 'rank-bronze', bgClass: '' };
            },

            calculateOverPower(pathPrefix = "") {
                if (!window.problemCatalog) return { earned: 0, max: 0, percent: 0 };

                const problems = window.problemCatalog.filter(p => {
                    if (!pathPrefix) return true;
                    return p.path === pathPrefix || p.path.startsWith(pathPrefix + '/');
                });

                let totalMaxOP = 0;
                let totalEarnedOP = 0;

                problems.forEach(p => {
                    const diff = p.difficulty || 5.0;
                    const maxOP = diff + 2.0;
                    totalMaxOP += maxOP;

                    const maxScore = this.state.levelMaxScores[p.level] || 100;
                    const result = this.results[p.id];
                    const bestScore = result ? Math.min(Number(result.bestScore || 0), maxScore) : (this.progress[p.id] ? maxScore : 0);
                    
                    totalEarnedOP += maxOP * (bestScore / maxScore);
                });

                return {
                    earned: totalEarnedOP.toFixed(2),
                    max: totalMaxOP.toFixed(2),
                    percent: totalMaxOP === 0 ? 0 : (totalEarnedOP / totalMaxOP * 100).toFixed(2)
                };
            },

            getProblemCount(pathPrefix) {
                if (!window.problemCatalog) return 0;
                return window.problemCatalog.filter(p => p.path === pathPrefix || p.path.startsWith(pathPrefix + '/')).length;
            },

                            </div>
                            <div style="text-align: right;">
                                <div style="font-size: 0.8rem; color: var(--text-muted);">Points</div>
                                <div style="font-weight: 600;">${overall.earned} / ${overall.max}</div>
                            </div>
                        </div>
                        <div class="op-grid">
                    `;

                    // カテゴリ別の算出
                    const categories = [
                        { label: '数学I', path: 'math/math_1' },
                        { label: '数学II', path: 'math/math_2' },
                        { label: '数学III', path: 'math/math_3' },
                        { label: '数学A', path: 'math/math_a' },
                        { label: '数学B', path: 'math/math_b' },
                        { label: '数学C', path: 'math/math_c' },
                        { label: '英:短文補充', path: 'english/short_fill' },
                        { label: '英:長文読解', path: 'english/long_reading' },
                        { label: '英:和訳', path: 'english/translation_ej' },
                        { label: '英:英訳', path: 'english/translation_je' }
                    ];

                    categories.forEach(cat => {
                        const stats = this.calculateOverPower(cat.path);
                        const r = this.getRankInfo(stats.percent);
                        html += `
                            <div class="op-item">
                                <div style="font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px;">${cat.label}</div>
                                <div class="${r.class}" style="font-size: 1.1rem; font-weight: 800;">${stats.percent}%</div>
                                <div class="progress-bar" style="height: 3px; margin-top: 6px;">
                                    <div class="progress-fill" style="width: ${stats.percent}%; height: 100%; background: ${r.class === 'rank-rainbow' ? 'linear-gradient(90deg, #ff00ff, #00ffff)' : ''}"></div>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div>`;
                    dashboard.innerHTML = html;
                    grid.parentElement.insertBefore(dashboard, grid);
                }

                if (node.children) {
                    for (const key in node.children) {
                        const childNode = node.children[key];
                        const path = [...this.state.path, key].join('/');
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = () => this.navigateDown(key);

                        const stats = this.getCourseStats(childNode, path);
                        const opStats = this.calculateOverPower(path);
                        const r = this.getRankInfo(opStats.percent);

                        const progressHtml = `
                            <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem; margin-top: 1rem;">
                                <span style="font-size: 0.875rem; color: var(--text-muted);">総問題数</span>
                                <span style="font-size: 0.875rem; font-weight: 600; color: var(--primary);">全${this.getProblemCount(path)}問</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; margin-top: 0.5rem;">
                                <span style="font-size: 0.875rem; color: var(--text-muted);">進捗率</span>
                                <span style="font-size: 0.875rem; font-weight: 600; color: var(--primary);">${stats.percent}% (${stats.completed}/${stats.total})</span>
                            </div>
                            <div class="progress-bar" style="margin-bottom: 1rem;">
                                <div class="progress-fill" style="width: ${stats.percent}%"></div>
                            </div>
                            
                            <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                                <span style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">Over Power</span>
                                <span class="${r.class}" style="font-size: 0.875rem; font-weight: 800;">${opStats.percent}%</span>
                            </div>
                            <div class="progress-bar" style="height: 6px;">
                                <div class="progress-fill" style="width: ${opStats.percent}%; background: ${r.class === 'rank-rainbow' ? 'linear-gradient(90deg, #ff00ff, #00ffff)' : ''}"></div>
                            </div>
                        `;

                        card.innerHTML = `
                            <h2>${childNode.title}</h2>
                            <p>${childNode.description || ''}</p>
                            <div style="margin-top: 0.5rem;">${progressHtml}</div>
                        `;
                        grid.appendChild(card);
                    }
                }
            },

            renderChapters() {
                const course = this.state.currentCourseNode;
                if (!course) return;
                document.getElementById('course-title').innerText = course.title;
                document.getElementById('course-desc').innerText = course.description || '';
                const stats = this.getCourseStats(course, this.state.path.join('/'));
                document.getElementById('course-progress-text').innerText = `${stats.percent}% (${stats.completed}/${stats.total})`;
                document.getElementById('course-progress-fill').style.width = `${stats.percent}%`;
                const list = document.getElementById('chapter-list');
                if (!list) return;
                list.innerHTML = '';

                const chapters = this.getChaptersForCourse(course);
                chapters.forEach((chapter, index) => {
                    const chEl = document.createElement('div');
                    chEl.className = 'chapter';
                    let lessonsHtml = '<ul class="lesson-list">';
                    if (chapter.lessons) {
                        chapter.lessons.forEach(lesson => {
                            const isCompleted = !!this.progress[lesson.id];
                            const statusMeta = this.getLessonStatusMeta(lesson.id);
                            const result = this.getLessonResult(lesson.id);
                            const bestScore = Number.isFinite(Number(result?.bestScore)) ? `${Math.round(Number(result.bestScore))}点` : '--';
                            const difficulty = lesson.difficulty !== undefined ? Number(lesson.difficulty).toFixed(1) : null;
                            const diffLevel = lesson.difficulty_level || (difficulty !== null ? (() => { const d = Number(lesson.difficulty); return d < 4 ? 'A' : d < 7 ? 'B' : d < 9 ? 'C' : 'D'; })() : '');
                            const diffHtml = difficulty !== null
                                ? `<span class="difficulty-tag diff-${diffLevel}">★ ${difficulty} <strong>${diffLevel}</strong></span>`
                                : '';
                            lessonsHtml += `
                                <li class="lesson-item ${isCompleted ? 'completed' : ''}" onclick="app.navigate('lesson', { lessonId: '${lesson.id}' })">
                                    <div class="lesson-title" style="flex-direction: column; align-items: flex-start; gap: 4px;">
                                        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                                            ${lesson.serial_number ? `<span class="serial-no-badge" style="margin-bottom: 0;">${lesson.serial_number}</span>` : ''}
                                            ${diffHtml}
                                        </div>
                                        <div style="display: flex; align-items: center; gap: 1rem;">
                                            <div class="status-icon">${isCompleted ? '✓' : ''}</div>
                                            <span>${lesson.title}</span>
                                        </div>
                                    </div>
                                    <div class="lesson-meta-right">
                                        <span class="lesson-best-score">Best ${bestScore}</span>
                                        <span class="${statusMeta.className}">${statusMeta.label}</span>
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
                                    </div>
                                </li>
                            `;
                        });
                    }
                    lessonsHtml += '</ul>';
                    chEl.innerHTML = `
                        <div class="chapter-header"><h3>Chapter ${index + 1}: ${chapter.title}</h3></div>
                        ${lessonsHtml}
                    `;
                    list.appendChild(chEl);
                });
            },

            findLessonInChapters(chapters, lessonId) {
                for (const ch of chapters) {
                    const found = (ch.lessons || []).find(l => l.id === lessonId);
                    if (found) return found;
                }
                return null;
            },

            renderLesson() {
                const course = this.state.currentCourseNode;
                if (!course) return;
                const chapters = this.getChaptersForCourse(course);
                const currentLesson = this.findLessonInChapters(chapters, this.state.currentLessonId);
                if (!currentLesson) return;

                // 通し番号・難易度の表示
                const serialDisplay = document.getElementById('serial-number-display');
                if (serialDisplay) {
                    const sn = currentLesson.serial_number || '';
                    const difficulty = currentLesson.difficulty !== undefined ? Number(currentLesson.difficulty).toFixed(1) : null;
                    const diffLevel = currentLesson.difficulty_level || (difficulty !== null ? (() => { const d = Number(currentLesson.difficulty); return d < 4 ? 'A' : d < 7 ? 'B' : d < 9 ? 'C' : 'D'; })() : '');
                    let html = '';
                    if (sn) html += `<span class="serial-no-badge">${sn}</span>`;
                    if (difficulty !== null) html += ` <span class="difficulty-tag diff-${diffLevel}" style="margin-left:6px;">★ ${difficulty} <strong>${diffLevel}</strong></span>`;
                    serialDisplay.innerHTML = html;
                }

                document.getElementById('lesson-title').innerText = currentLesson.title;

                const editorPanel = document.getElementById('editor-panel');
                const drillPanel = document.getElementById('drill-panel');
                const drillInputArea = document.getElementById('drill-input-area');
                const drillChoicesArea = document.getElementById('drill-choices-area');
                const drillSubmitBtn = document.getElementById('drill-submit-btn');
                const drillPrompt = document.getElementById('drill-prompt');

                if (course.mode === 'practice') {
                    // 練習モードの問題文表示
                    document.getElementById('lesson-content').innerHTML = currentLesson.content ? `<div class="practice-content" style="font-size: 1.5rem; line-height: 1.6; margin-bottom: 2rem; padding: 2rem; background: #f1f5f9; border-radius: 12px; border: 1px solid var(--border); text-align: center; font-weight: 500; color: var(--text-main);">${currentLesson.content}</div>` : '';

                    editorPanel.style.display = 'none';
                    drillPanel.style.display = 'flex';

                    if (currentLesson.choices && currentLesson.choices.length > 0) {
                        drillInputArea.style.display = 'none';
                        drillChoicesArea.style.display = 'grid';
                        drillSubmitBtn.style.display = 'none';
                        drillPrompt.innerText = '適切なものを選択してください';

                        drillChoicesArea.innerHTML = '';
                        currentLesson.choices.forEach(choice => {
                            const btn = document.createElement('button');
                            btn.className = 'choice-btn';
                            btn.innerText = choice;
                            btn.onclick = () => {
                                Array.from(drillChoicesArea.children).forEach(c => c.classList.remove('selected'));
                                btn.classList.add('selected');
                                this.checkAnswer(choice);
                            };
                            drillChoicesArea.appendChild(btn);
                        });
                    } else {
                        drillChoicesArea.style.display = 'none';
                        drillSubmitBtn.style.display = 'block';
                        drillPrompt.innerText = '解答を入力してください';

                        const drillInput = document.getElementById('drill-input');
                        const drillTextarea = document.getElementById('drill-textarea');

                        // パスから記述式（長い解答）かどうかを判定
                        const isLongAnswer = this.state.path.some(p => p.includes('translation') || p.includes('reading'));

                        if (isLongAnswer) {
                            drillInput.style.display = 'none';
                            drillTextarea.style.display = 'block';
                            drillTextarea.value = '';
                            setTimeout(() => drillTextarea.focus(), 100);
                        } else {
                            drillInput.style.display = 'block';
                            drillTextarea.style.display = 'none';
                            drillInput.value = '';
                            setTimeout(() => drillInput.focus(), 100);
                        }
                    }
                } else {
                    document.getElementById('lesson-content').innerHTML = currentLesson.content || '';
                    editorPanel.style.display = 'flex';
                    drillPanel.style.display = 'none';
                    document.getElementById('code-editor').value = currentLesson.defaultCode || '';
                }

                document.getElementById('lesson-instruction').innerHTML = currentLesson.instruction || '';

                // AI採点切替の表示制御
                const pathStr = this.state.path.join('/');
                const isTargetForAI = pathStr.includes('translation') || pathStr.includes('math');
                const aiSelector = document.getElementById('ai-grading-selector');
                if (aiSelector) {
                    aiSelector.style.display = isTargetForAI ? 'flex' : 'none';
                }

                // 状態のリセット
                this.setGradingMode('normal');
                document.getElementById('ai-result-area').style.display = 'none';
                document.getElementById('ai-result-area').innerHTML = '';
                document.getElementById('submit-btn-text').innerText = course.mode === 'practice' ? '回答を送信' : 'コードを提出して判定';
                document.getElementById('math-image-input').value = '';
                document.getElementById('math-image-preview').style.display = 'none';

                // フィードバックのリセット
                document.getElementById('feedback-msg').className = 'feedback';
                document.getElementById('feedback-msg').innerHTML = '';
                document.getElementById('drill-feedback-msg').className = 'drill-feedback feedback';
                document.getElementById('drill-feedback-msg').innerHTML = '';
            },

            async checkAnswer(choiceOverride) {
                const course = this.state.currentCourseNode;
                if (!course) return;
                const chapters = this.getChaptersForCourse(course);
                const currentLesson = this.findLessonInChapters(chapters, this.state.currentLessonId);
                if (!currentLesson) return;

                const feedback = document.getElementById(course.mode === 'practice' ? 'drill-feedback-msg' : 'feedback-msg');
                const submitBtnText = document.getElementById('submit-btn-text');

                // AI採点モード
                if (this.state.gradingMode === 'ai') {
                    submitBtnText.innerHTML = '<span class="loading-spinner"></span> 採点中...';
                    const submitBtn = document.getElementById('drill-submit-btn');
                    submitBtn.disabled = true;
                    feedback.style.display = 'none';
                    document.getElementById('ai-result-area').style.display = 'none';

                    try {
                        const isMath = this.state.path.includes('math');
                        let answerData = '';
                        let isImage = false;

                        if (isMath) {
                            const imgPreview = document.getElementById('math-image-preview');
                            if (!imgPreview.src || imgPreview.style.display === 'none') {
                                throw new Error('答案画像をアップロードしてください。');
                            }
                            answerData = imgPreview.src;
                            isImage = true;
                        } else {
                            const drillInput = document.getElementById('drill-input');
                            const drillTextarea = document.getElementById('drill-textarea');
                            answerData = drillTextarea.style.display !== 'none' ? drillTextarea.value : drillInput.value;
                            if (!answerData.trim()) throw new Error('解答を入力してください。');
                        }

                        const level = this.state.path.find(p => p.startsWith('level_')) || 'level_A';

                        // ブラウザから直接APIを叩く
                        if (this.geminiModel) {
                            const max_score = this.state.levelMaxScores[level] || 100;
                            const prompt = `
あなたは教育の専門家です。以下の問題に対する生徒の解答を採点し、詳細なフィードバックをJSON形式で返してください。

【問題情報】
タイトル: ${currentLesson.title}
問題の指示: ${currentLesson.instruction}
問題の内容: ${currentLesson.content}
正解例: ${Array.isArray(currentLesson.answers) ? currentLesson.answers.join(', ') : currentLesson.answers}
レベル: ${level} (満点: ${max_score}点)

【生徒の解答】
${isImage ? '(画像データが送信されました。画像内の内容を読み取って採点してください)' : answerData}

【採点・評価基準】
- S: 完璧。非の打ち所がない解答。満点の ${max_score} 点を付与。
- A: ほぼ正解。些細なミスはあるが、概念の理解は十分。${Math.floor(max_score * 0.8)}〜${max_score - 1} 点程度。
- B: 半分以上正解。重要なポイントは押さえている。${Math.floor(max_score * 0.6)}〜${Math.floor(max_score * 0.7)} 点程度。
- C: 不十分。理解が不足している。${Math.floor(max_score * 0.4)}〜${Math.floor(max_score * 0.5)} 点程度。
- D: ほとんど白紙、または全く的外れな解答。${Math.floor(max_score * 0.2)}点以下。

【出力形式 (必ず以下のJSON構造のみを返してください。説明文は不要です)】
{
  "score": 0〜${max_score}の数値,
  "evaluation": "S", "A", "B", "C", "D" のいずれか,
  "commentary": {
    "good_points": "解答の中で評価できる具体的な点",
    "bad_points": "間違いや改善が必要な具体的な点",
    "advice": "今後どのように学習すべきかのアドバイス",
    "solution": "理想的な解答例とその解説（改行は\\nを使用）"
  }
}
`;
                            let resultText = '';
                            if (isImage) {
                                const base64Data = answerData.split(',')[1];
                                const response = await this.geminiModel.generateContent([
                                    prompt,
                                    { inlineData: { mimeType: "image/png", data: base64Data } }
                                ]);
                                resultText = response.response.text();
                            } else {
                                const response = await this.geminiModel.generateContent(prompt);
                                resultText = response.response.text();
                            }

                            const jsonMatch = resultText.match(/\{[\s\S]*\}/);
                            if (!jsonMatch) throw new Error("AIの回答を解析できませんでした。");
                            const result = JSON.parse(jsonMatch[0]);
                            
                            const aiScore = Number(result.score);
                            const prevBest = Number(this.getLessonResult(currentLesson.id)?.bestScore);
                            const isBest = Number.isFinite(aiScore) && (!Number.isFinite(prevBest) || aiScore >= prevBest);
                            
                            this.recordAttempt(currentLesson.id, {
                                score: aiScore,
                                evaluation: result.evaluation,
                                cleared: true,
                                isBest,
                            });
                            this.markLessonComplete(currentLesson.id);
                            app.renderAIResult(result);
                            return;
                        }

                        // サーバーフォールバック
                        const response = await fetch(`${this.state.apiBaseUrl}/grade`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                problem: currentLesson,
                                answer: answerData,
                                is_image: isImage,
                                level: level
                            })
                        });

                        if (!response.ok) throw new Error('AIサーバーに接続できません。設定画面からAPIキーを設定するか、サーバーを起動してください。');

                        const result = await response.json();
                        const aiScore = Number(result.score);
                        const prevBest = Number(this.getLessonResult(currentLesson.id)?.bestScore);
                        const isBest = Number.isFinite(aiScore) && (!Number.isFinite(prevBest) || aiScore >= prevBest);
                        
                        this.recordAttempt(currentLesson.id, {
                            score: aiScore,
                            evaluation: result.evaluation,
                            cleared: true,
                            isBest,
                        });
                        this.markLessonComplete(currentLesson.id);
                        app.renderAIResult(result);

                    } catch (err) {
                        feedback.className = (course.mode === 'practice' ? 'drill-feedback ' : '') + 'feedback error';
                        feedback.innerHTML = `✗ エラー: ${err.message}`;
                        feedback.style.display = 'flex';
                    } finally {
                        submitBtnText.innerText = '回答を送信';
                        submitBtn.disabled = false;
                    }
                    return;
                }

                let code = '';
                if (choiceOverride) {
                    code = choiceOverride;
                } else if (course.mode === 'practice') {
                    const drillInput = document.getElementById('drill-input');
                    const drillTextarea = document.getElementById('drill-textarea');
                    code = drillTextarea.style.display !== 'none' ? drillTextarea.value : drillInput.value;
                } else {
                    code = document.getElementById('code-editor').value;
                }

                let isCorrect = false;
                try {
                    if (typeof currentLesson.check === 'function') {
                        isCorrect = currentLesson.check(code);
                    } else if (currentLesson.answers) {
                        const input = code.trim();
                        // スペースを除去して正規化する（数学用）
                        const normalizeAnswer = (s) => s.toLowerCase().replace(/[\s　]/g, '');
                        const isMathProblem = this.state.path.includes('math');
                        if (currentLesson.matchType === 'regex') {
                            isCorrect = currentLesson.answers.some(a => new RegExp(a, 'i').test(input));
                        } else if (isMathProblem) {
                            // 数学: スペース無視の正規化比較（例: "x^2 - 3x - 28" == "x^2-3x-28"）
                            const normInput = normalizeAnswer(input);
                            isCorrect = currentLesson.answers.some(a => normalizeAnswer(a) === normInput);
                        } else {
                            // 英語等: 通常の大文字小文字無視比較
                            isCorrect = currentLesson.answers.some(a => input.toLowerCase() === a.toLowerCase().trim());
                        }
                    }
                } catch (e) {
                    console.error(e);
                }

                if (isCorrect) {
                    this.markLessonComplete(currentLesson.id);
                    this.recordAttempt(currentLesson.id, {
                        score: 100,
                        evaluation: 'OK',
                        cleared: true,
                        isBest: true,
                    });
                    feedback.className = (course.mode === 'practice' ? 'drill-feedback ' : '') + 'feedback success';
                    feedback.innerHTML = '✓ 正解！習得完了です。';
                    feedback.style.display = 'flex';
                    setTimeout(() => {
                        if (confirm('素晴らしい！目次に戻って次のレッスンに進みますか？')) {
                            this.navigate('chapters');
                        }
                    }, 1000);
                } else {
                    feedback.className = (course.mode === 'practice' ? 'drill-feedback ' : '') + 'feedback error';
                    feedback.innerHTML = '✗ もう一度確認してみましょう。';
                    feedback.style.display = 'flex';
                }
            },

            renderAIResult(result) {
                const area = document.getElementById('ai-result-area');
                area.style.display = 'block';
                area.innerHTML = `
                    <div class="ai-score-badge">
                        <div class="ai-score-value">${result.score}点</div>
                        <div class="ai-eval-badge">評価: ${result.evaluation}</div>
                    </div>
                    <div class="ai-commentary-grid">
                        <div class="ai-comment-box good">
                            <h5>👍 良かった点</h5>
                            <p>${result.commentary.good_points}</p>
                        </div>
                        <div class="ai-comment-box bad">
                            <h5>⚠️ 改善が必要な点</h5>
                            <p>${result.commentary.bad_points}</p>
                        </div>
                        <div class="ai-comment-box advice">
                            <h5>💡 アドバイス</h5>
                            <p>${result.commentary.advice}</p>
                        </div>
                        <div class="ai-comment-box solution">
                            <h5>📖 理想的な解答・解説</h5>
                            <p>${result.commentary.solution.replace(/\n/g, '<br>')}</p>
                        </div>
                    </div>
                `;
                area.scrollIntoView({ behavior: 'smooth' });
            }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>

</html>
